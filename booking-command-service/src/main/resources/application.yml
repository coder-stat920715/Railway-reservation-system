server:
  port: 8083
spring:
  application:
    name: booking-command-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/booking_command_db
    username: ${DB_USER:railway}
    password: ${DB_PASSWORD:railway}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: booking-command-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 4000
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
resilience4j:
  circuitbreaker:
    instances:
      pricing:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - java.io.IOException
          - feign.RetryableException
          - feign.FeignException$FeignServerException
  retry:
    instances:
      pricing:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
  ratelimiter:
    instances:
      pricing:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries,ratelimiters
